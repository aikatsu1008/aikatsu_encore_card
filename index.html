<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アイカツ！アンコール MY CARD v11</title>
<style>
:root{--pink:#ff73ad;--pink2:#fff0f6;--bg:#fff8fc;--ink:#49333f;--muted:#9a8791;--line:#efdce7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:10;background:#fffafcee;backdrop-filter:blur(10px);padding:14px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0 0 3px}.sub{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:7px;margin-top:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:11px}.stat b{font-size:15px}
main{padding:13px 11px 100px}.tools{display:flex;gap:7px;margin-bottom:11px}.tools input,.tools select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;font-size:13px}.tools input{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;position:relative;box-shadow:0 2px 7px #80607012}.card.unowned{filter:grayscale(1);opacity:.48}
.card img{width:100%;aspect-ratio:.69;object-fit:cover;border-radius:9px;background:#eee}.id{font-size:11px;font-weight:800;margin-top:4px}.name{font-size:10px;line-height:1.3;margin-top:2px;min-height:2.6em}.nameSearch{margin-top:9px}.nameSearch input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px}.nameCandidates{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.nameCandidate{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;text-align:left}.nameCandidate b{display:block}.progress{font-size:12px;color:var(--muted);margin-top:7px}.meta{display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}
.qty{position:absolute;right:8px;top:8px;background:var(--pink);color:#fff;border-radius:999px;padding:3px 6px;font-size:10px;font-weight:800}
.controls{display:flex;gap:4px;margin-top:5px}.controls button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px;font-weight:800}.dup{font-size:10px;color:#e34c8d;font-weight:800;margin-top:3px}
.empty{text-align:center;padding:55px 10px;color:var(--muted);grid-column:1/-1}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;color:#907b85;font-size:11px;padding:6px 2px;border-radius:11px}nav button.active{background:var(--pink2);color:#e74d91;font-weight:800}
.scanbox{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.scanbox h2{font-size:17px;margin:0 0 6px}.scanbox p{font-size:12px;line-height:1.65;color:var(--muted)}
.guide{height:230px;border:2px dashed #ff8bbb;border-radius:14px;position:relative;background:linear-gradient(#fffafe,#fff);margin:12px 0}
.guide:before{content:"";position:absolute;left:4%;bottom:5%;width:42%;height:30%;border:2px solid var(--pink);border-radius:10px}.guide:after{content:"カードの左下端をここへ";position:absolute;left:7%;bottom:8%;background:#fff;padding:5px;border-radius:7px;font-size:10px;color:#d94b88}
.scanbtn{display:block;width:100%;border:0;border-radius:13px;background:var(--pink);color:#fff;padding:13px;font-weight:800}.secondary{background:#f8edf2!important;color:var(--ink)!important}
.result{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.result input{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;font-size:18px;font-weight:800;text-transform:uppercase}
.candidate{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;margin:5px 3px 0 0}.ok{color:#14885a}.err{color:#d33e6c}
.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#49333f;color:#fff;padding:9px 13px;border-radius:999px;font-size:12px;z-index:30}
.hidden{display:none}

/* v11 additions */
.categoryTabs{display:flex;gap:6px;overflow:auto;margin:0 0 10px;padding-bottom:2px}.categoryTabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;color:var(--ink)}.categoryTabs button.active{background:var(--pink);color:#fff;border-color:var(--pink);font-weight:800}.ownedHero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.ownedHero h2{font-size:17px;margin:0}.ownedMiniStats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mini{background:var(--pink2);border-radius:999px;padding:5px 8px;font-size:10px}.ownedGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.ownedCard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px;position:relative}.ownedCard img{width:100%;aspect-ratio:.69;object-fit:cover;border-radius:7px}.ownedCard .oid{font-size:9px;font-weight:800;margin-top:3px}.ownedCard .oq{position:absolute;right:5px;top:5px;background:var(--pink);color:#fff;border-radius:999px;padding:2px 5px;font-size:9px;font-weight:800}.parallelBadge{display:inline-block;background:#eee0ff;color:#7a45b8;border-radius:999px;padding:2px 5px;font-size:8px;font-weight:800;margin-top:2px}.kindNote{font-size:10px;color:var(--muted);margin:-3px 0 8px}.ownedActions{display:flex;gap:6px;margin-top:8px}.ownedActions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-weight:700;font-size:11px}

</style>
</head>

<script>
const CARDS=[{"id":"E1-01","rarity":"PR","set":"1弾","name":"オーロラキスキャミソール"},{"id":"E1-02","rarity":"PR","set":"1弾","name":"オーロラキスドレープスカート"},{"id":"E1-03","rarity":"PR","set":"1弾","name":"オーロラキスバレエシューズ"},{"id":"E1-04","rarity":"PR","set":"1弾","name":"オーロラキスリボン"},{"id":"E1-05","rarity":"R","set":"1弾","name":"アイスブルーフリルキャミソール"},{"id":"E1-06","rarity":"R","set":"1弾","name":"アイスブルーフリルパニエ"},{"id":"E1-07","rarity":"R","set":"1弾","name":"アイスブルーシューズ"},{"id":"E1-08","rarity":"R","set":"1弾","name":"ジュエルつきパープルリボン"},{"id":"E1-09","rarity":"R","set":"1弾","name":"小花柄イエローワンピ"},{"id":"E1-10","rarity":"R","set":"1弾","name":"ドリーミースタートップス"},{"id":"E1-11","rarity":"R","set":"1弾","name":"ドリーミースタースカート"},{"id":"E1-12","rarity":"R","set":"1弾","name":"ドリーミースターパンプス"},{"id":"E1-13","rarity":"R","set":"1弾","name":"チャーミーリボントップス"},{"id":"E1-14","rarity":"R","set":"1弾","name":"チャーミーリボンスカート"},{"id":"E1-15","rarity":"R","set":"1弾","name":"チャーミーリボンサンダル"},{"id":"E1-16","rarity":"R","set":"1弾","name":"チャーミーリボンアクセ"},{"id":"E1-17","rarity":"R","set":"1弾","name":"クリアネスイエロートップス"},{"id":"E1-18","rarity":"R","set":"1弾","name":"クリアネスイエロースカート"},{"id":"E1-19","rarity":"R","set":"1弾","name":"クリアネスイエローパンプス"},{"id":"E1-20","rarity":"R","set":"1弾","name":"クリアネスイエローアクセ"},{"id":"E1-21","rarity":"N","set":"1弾","name":"ピンクステージベスト"},{"id":"E1-22","rarity":"N","set":"1弾","name":"ピンクステージスカート"},{"id":"E1-23","rarity":"N","set":"1弾","name":"ピンクステージシューズ"},{"id":"E1-24","rarity":"N","set":"1弾","name":"パフスリーブレモンカラーボレロ"},{"id":"E1-25","rarity":"N","set":"1弾","name":"ラベンダーフリルスカート"},{"id":"E1-26","rarity":"N","set":"1弾","name":"イエロー編み上げブーツ"},{"id":"E1-27","rarity":"N","set":"1弾","name":"ピンクブロッサムトップス"},{"id":"E1-28","rarity":"N","set":"1弾","name":"ピンクブロッサムスカート"},{"id":"E1-29","rarity":"N","set":"1弾","name":"ピンクブロッサムブーツ"},{"id":"E1-30","rarity":"ER","set":"1弾","name":"オデットスワン"},{"id":"E1-31","rarity":"ER","set":"1弾","name":"リルリボンストーリー"},{"id":"E1-32","rarity":"ER","set":"1弾","name":"オーロラペガサス"},{"id":"E1-33","rarity":"PR","set":"1弾"," セクシーロゴチューブトップ"},{"id":"E1-66","rarity":"N","set":"1弾","name":"ベルトつきレザースカート"},{"id":"E1-67","rarity":"N","set":"1弾","name":"サイハイレザーブーツ"},{"id":"E1-68","rarity":"N","set":"1弾","name":"パープルブロッサムトップス"},{"id":"E1-69","rarity":"N","set":"1弾","name":"パープルブロッサムスカート"},{"id":"E1-70","rarity":"N","set":"1弾","name":"パープルブロッサムブーツ"},{"id":"E1-71","rarity":"PR","set":"1弾","name":"サンシャインスターウェイトップス"},{"id":"E1-72","rarity":"PR","set":"1弾","name":"サンシャインスターウェイスカート"},{"id":"E1-73","rarity":"PR","set":"1弾","name":"サンシャインスターウェイシューズ"},{"id":"E1-74","rarity":"PR","set":"1弾","name":"サンシャインスターウェイカチューシャ"},{"id":"E1-75","rarity":"PR","set":"1弾","name":"サンライズスターウェイトップス"},{"id":"E1-76","rarity":"PR","set":"1弾","name":"サンライズスターウェイスカート"},{"id":"E1-77","rarity":"PR","set":"1弾","name":"サンライズスターウェイシューズ"},{"id":"E1-78","rarity":"PR","set":"1弾","name":"サンライズスターウェイカチューシャ"},{"id":"E1-79","rarity":"PR","set":"1弾","name":"サンセットスターウェイトップス"},{"id":"E1-80","rarity":"PR","set":"1弾","name":"サンセットスターウェイスカート"},{"id":"E1-81","rarity":"PR","set":"1弾","name":"サンセットスターウェイシューズ"},{"id":"E1-82","rarity":"PR","set":"1弾","name":"サンセットスターウェイカチューシャ"},{"id":"E1-83","rarity":"N","set":"1弾","name":"イエローブロッサムトップス"},{"id":"E1-84","rarity":"N","set":"1弾","name":"イエローブロッサムスカート"},{"id":"E1-85","rarity":"N","set":"1弾","name":"イエローブロッサムブーツ"},{"id":"EP-001","rarity":"N","set":"プロモ","name":"ピンクステージベスト＆スカート"},{"id":"EP-002","rarity":"PR","set":"プロモ","name":"レジェンダリールージュティアラ"},{"id":"EP-003","rarity":"N","set":"プロモ","name":"エメラルドコクーンワンピ"},{"id":"EP-004","rarity":"N","set":"プロモ","name":"エメラルドアゲハミュール"},{"id":"EP-005","rarity":"N","set":"プロモ","name":"ピンクシフォンカチューシャ"},{"id":"EP-006","rarity":"N","set":"プロモ","name":"ピンクリボンつきフリルシャツ"},{"id":"EP-007","rarity":"N","set":"プロモ","name":"ピンクアーガイルカーデ"},{"id":"EP-008","rarity":"N","set":"プロモ","name":"ピンクプリーツスカート"},{"id":"EP-009","rarity":"N","set":"プロモ","name":"ガーリーローファー"},{"id":"EP-010","rarity":"N","set":"プロモ","name":"ピンクリボンカチューシャ"},{"id":"EP-011","rarity":"N","set":"プロモ","name":"スターライト学園ピンクジャージ"},{"id":"EP-012","rarity":"N","set":"プロモ","name":"スターライト学園ブルージャージ"},{"id":"EP-013","rarity":"N","set":"プロモ","name":"スターライト学園パープルジャージ"},{"id":"EP-014","rarity":"N","set":"プロモ","name":"スターライト学園オレンジジャージ"},{"id":"EP-015","rarity":"N","set":"プロモ","name":"スターライト学園スニーカー"},{"id":"EP-016","rarity":"N","set":"プロモ","name":"ブラックダイヤモンドジュエリーワンピ"},{"id":"EP-017","rarity":"N","set":"プロモ","name":"ピンクの小花柄ワンピ"},{"id":"EP-018","rarity":"N","set":"プロモ","name":"編み上げラベンダーブーツ"},{"id":"EP-029","rarity":"R","set":"プロモ","name":"スターライト学園制服"},{"id":"EP-030","rarity":"R","set":"プロモ","name":"スターライト学園ブーツ"},{"id":"EP-037","rarity":"N","set":"プロモ","name":"エンブレムつきセーラーマリンベスト＆スカート"},{"id":"EP-038","rarity":"N","set":"プロモ","name":"ブルーワークブーツ"}];

/* パラレル版：公式サイトの「パラレルカード」表示に対応。
   現時点で外部情報から確認できた1弾のパラレルを登録。画像は対応する通常カードを参照し、
   所持数は通常カードとは別に管理します。 */
const PARALLELS=[
 {id:"E1-01-P",baseId:"E1-01",rarity:"PR",set:"1弾・パラレル",name:"オーロラキスキャミソール",kind:"parallel"},
 {id:"E1-02-P",baseId:"E1-02",rarity:"PR",set:"1弾・パラレル",name:"オーロラキスドレープスカート",kind:"parallel"},
 {id:"E1-03-P",baseId:"E1-03",rarity:"PR",set:"1弾・パラレル",name:"オーロラキスバレエシューズ",kind:"parallel"},
 {id:"E1-04-P",baseId:"E1-04",rarity:"PR",set:"1弾・パラレル",name:"オーロラキスリボン",kind:"parallel"},
 {id:"E1-30-P",baseId:"E1-30",rarity:"ER",set:"1弾・パラレル",name:"オデットスワン",kind:"parallel"},
 {id:"E1-34-P",baseId:"E1-34",rarity:"PR",set:"1弾・パラレル",name:"天の川コズミックスカート",kind:"parallel"},
 {id:"E1-35-P",baseId:"E1-35",rarity:"PR",set:"1弾・パラレル",name:"天の川コズミックブーツ",kind:"parallel"},
 {id:"E1-36-P",baseId:"E1-36",rarity:"PR",set:"1弾・パラレル",name:"天の川コズミックカチューシャ",kind:"parallel"},
 {id:"E1-73-P",baseId:"E1-73",rarity:"PR",set:"1弾・パラレル",name:"サンシャインスターウェイシューズ",kind:"parallel"},
 {id:"E1-78-P",baseId:"E1-78",rarity:"PR",set:"1弾・パラレル",name:"サンライズスターウェイカチューシャ",kind:"parallel"}
];
const ALL_CARDS=[...CARDS,...PARALLELS];
const VALID=new Set(ALL_CARDS.map(c=>c.id));

const KEY="aikatsu_encore_quantities_v2";

let qty={};
try{qty=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){qty={};}

/* 旧アプリの boolean 所持データも引き継ぐ */
try{
 const old=JSON.parse(localStorage.getItem("aikatsu_v5_owned")||"{}");
 for(const id of Object.keys(old)){
   if(VALID.has(id) && qty[id]==null && old[id]) qty[id]=1;
 }
}catch(e){}

for(const id of Object.keys(qty)){
 const n=Number(qty[id]);
 if(!VALID.has(id)||!Number.isFinite(n)||n<=0) delete qty[id];
 else qty[id]=Math.floor(n);
}

let view="all",search="",rarityFilter="",kindFilter="normal";

function save(){localStorage.setItem(KEY,JSON.stringify(qty));updateStats()}
function updateStats(){
 let owned=0,total=0,dups=0;
 for(const n of Object.values(qty)){owned++;total+=n;dups+=Math.max(0,n-1)}
 ownedCount.textContent=owned;totalCount.textContent=total;dupCount.textContent=dups;
}
function changeQty(id,delta){
 const n=Math.max(0,(Number(qty[id])||0)+delta);
 if(n===0)delete qty[id]; else qty[id]=n;
 save();render();
}
function imageUrl(c){return `https://dcd.aikatsu.com/encore/images/cardlist/card/${c.id}_${c.rarity}.webp`}

function cardHTML(c){
 const n=Number(qty[c.id]||0);
 return `<article class="card ${n?"":"unowned"}">
 <div class="${n>1?"qty":"hidden"}">×${n}</div>
 <img src="${imageUrl(c)}" alt="${c.id}" loading="lazy" onerror="this.style.visibility='hidden'">
 <div class="id">${c.id}</div>
 <div class="name">${escapeHtml(c.name)}</div>
 <div class="meta"><span>${c.rarity}</span><span>${c.set}</span></div>${c.kind==="parallel"?`<span class="parallelBadge">✨ PARALLEL</span>`:""}
 <div class="controls"><button onclick="changeQty('${c.id}',-1)">−</button><button onclick="changeQty('${c.id}',1)">＋</button></div>
 ${n>1?`<div class="dup">ダブり ×${n-1}</div>`:""}
 </article>`;
}

function render(){
 if(view==="scan"){renderScan();return}
 if(view==="owned"){renderOwned(false);return}
 if(view==="dup"){renderOwned(true);return}
 let list=ALL_CARDS.filter(c=>{
   if(search){const q=search.toLowerCase();if(!c.id.toLowerCase().includes(q)&&!c.name.toLowerCase().includes(q))return false;}
   if(kindFilter==="parallel"&&c.kind!=="parallel")return false;
   if(kindFilter==="er"&&c.rarity!=="ER")return false;
   if(kindFilter==="normal"&&c.kind==="parallel")return false;
   if(rarityFilter&&c.rarity!==rarityFilter)return false;
   return true;
 });
 app.innerHTML=`<div class="tools">
 <input placeholder="カード番号・コーデ名を検索" value="${escapeHtml(search)}" oninput="search=this.value;render()">
 <select onchange="rarityFilter=this.value;render()"><option value="">レアリティ</option><option>PR</option><option>R</option><option>ER</option><option>N</option></select>
 </div>
 <div class="categoryTabs">
 <button class="${kindFilter==='normal'?'active':''}" onclick="kindFilter='normal';rarityFilter='';render()">📚 通常</button>
 <button class="${kindFilter==='er'?'active':''}" onclick="kindFilter='er';rarityFilter='ER';render()">💎 ER</button>
 <button class="${kindFilter==='parallel'?'active':''}" onclick="kindFilter='parallel';rarityFilter='';render()">✨ パラレル</button>
 <button class="${kindFilter==='all'?'active':''}" onclick="kindFilter='all';rarityFilter='';render()">🌟 すべて</button>
 </div>
 <div class="kindNote">${kindFilter==='parallel'?'パラレルは通常カードとは別に所持数を管理♡':kindFilter==='er'?'アンコールレアだけ表示中♡':'カード番号・コーデ名から探せるよ♡'}</div>
 <div class="grid">${list.length?list.map(cardHTML).join(""):`<div class="empty">カードが見つからないよ</div>`}</div>`;
}
function renderOwned(duplicates){
 const list=ALL_CARDS.filter(c=>{const n=Number(qty[c.id]||0);return duplicates?n>=2:n>=1});
 const unique=list.length,total=list.reduce((a,c)=>a+Number(qty[c.id]||0),0);
 const er=list.filter(c=>c.rarity==='ER').length;
 const par=list.filter(c=>c.kind==='parallel').length;
 app.innerHTML=`<section class="ownedHero">
 <h2>${duplicates?'🃏 ダブりカード':'💗 所持カード'}</h2>
 <div class="ownedMiniStats"><span class="mini">${unique}種類</span><span class="mini">${total}枚</span><span class="mini">💎 ER ${er}</span><span class="mini">✨ パラレル ${par}</span></div>
 <div class="ownedActions"><button onclick="view='all';kindFilter='all';rarityFilter='';render();syncNav()">📚 全カード</button><button onclick="view='scan';render();syncNav()">📷 追加</button></div>
 </section>
 <div class="ownedGrid">${list.length?list.map(c=>{const n=Number(qty[c.id]||0);return `<article class="ownedCard"><div class="oq">×${n}</div><img src="${imageUrl(c)}" alt="${escapeHtml(c.name)}" loading="lazy"><div class="oid">${c.id}</div>${c.kind==='parallel'?'<span class="parallelBadge">✨ P</span>':''}</article>`}).join(''):`<div class="empty">${duplicates?'まだダブりカードはないよ♡':'まだ所持カードがないよ♡'}</div>`}</div>`;
}
function syncNav(){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function renderScan(){
 app.innerHTML=`<section class="scanbox">
 <h2>📷 カードを読み込む</h2>
 <p>カード番号が印刷されている<strong>左下端</strong>を重点的に読み取ります。<br>iPhoneで重くなりにくいよう、画像を縮小して<strong>少ない回数で解析</strong>します。<br><strong>OCRだけでは自動登録しません。</strong></p>
 <div class="guide"></div>
 <input id="photo" type="file" accept="image/*" capture="environment" class="hidden">
 <button class="scanbtn" onclick="photo.click()">📷 写真を撮る / 選ぶ</button>
 <div id="scanStatus" class="result"><span class="sub">E1-01 / EP-037 のような図鑑番号を探します。</span></div>
 </section>`;
 photo.onchange=()=>photo.files[0]&&runOCR(photo.files[0]);
}
function loadTesseract(){
 return new Promise((resolve,reject)=>{
   if(window.Tesseract){resolve();return}
   const s=document.createElement("script");
   s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
   s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
 });
}
function normalize(s){
 return String(s).toUpperCase().replace(/[‐‑‒–—―ー]/g,"-").replace(/\s/g,"")
 .replace(/EL-/g,"E1-").replace(/EI-/g,"E1-").replace(/EⅠ-/g,"E1-");
}
function extractIds(text){
 const x=normalize(text),out=[],re=/(E1|EP)-?(\d{1,3})/g;let m;
 while((m=re.exec(x))){
   const id=m[1]+"-"+m[2].padStart(2,"0");
   if(VALID.has(id)&&!out.includes(id))out.push(id);
 }
 return out;
}
async function imageToCanvas(file,maxSide=1500){
 const bitmap=await createImageBitmap(file);
 let W=bitmap.width,H=bitmap.height;
 const ratio=Math.min(1,maxSide/Math.max(W,H));
 W=Math.max(1,Math.round(W*ratio));H=Math.max(1,Math.round(H*ratio));
 const canvas=document.createElement("canvas");canvas.width=W;canvas.height=H;
 canvas.getContext("2d",{willReadFrequently:true}).drawImage(bitmap,0,0,W,H);
 if(bitmap.close)bitmap.close();
 return canvas;
}
function makeCrop(source,x1,y1,x2,y2,scale,mode="color"){
 const W=source.width,H=source.height;
 const sx=Math.round(W*x1),sy=Math.round(H*y1),sw=Math.max(1,Math.round(W*(x2-x1))),sh=Math.max(1,Math.round(H*(y2-y1)));
 const maxOut=1400, s=Math.min(scale,maxOut/Math.max(sw,sh));
 const c=document.createElement("canvas");c.width=Math.max(1,Math.round(sw*s));c.height=Math.max(1,Math.round(sh*s));
 const ctx=c.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(source,sx,sy,sw,sh,0,0,c.width,c.height);
 if(mode!=="color"){
   const img=ctx.getImageData(0,0,c.width,c.height),d=img.data;
   for(let i=0;i<d.length;i+=4){
     const y=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;
     let v=y;
     if(mode==="threshold") v=y>165?255:0;
     else if(mode==="contrast") v=Math.max(0,Math.min(255,(y-128)*2+128));
     d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;
   }
   ctx.putImageData(img,0,0);
 }
 return c;
}
async function runOCR(file){
 scanStatus.innerHTML="<b>🔍 カード番号を読み取り中…</b><p class='progress'>写真を準備しています♡</p>";
 let worker=null;
 try{
   await loadTesseract();
   const source=await imageToCanvas(file,1200);
   /* カード番号が小さいので、左下を少し広めに切り出し、
      色→グレースケール→二値化の3パターンだけを1つのOCRエンジンで読む。 */
   const crops=[
     makeCrop(source,0,.68,.48,1,5,"color"),
     makeCrop(source,0,.68,.48,1,5,"contrast"),
     makeCrop(source,0,.60,.58,1,4,"threshold")
   ];
   const found=[];let raw=[];
   worker=await Tesseract.createWorker("eng",1,{logger:m=>{
     if(m&&m.status&&typeof m.progress==="number"){
       const pct=Math.round(m.progress*100);
       scanStatus.innerHTML=`<b>🔍 カード番号を読み取り中…</b><p class='progress'>OCR ${pct}%</p>`;
     }
   }});
   await worker.setParameters({
     tessedit_char_whitelist:"E1P0123456789-",
     preserve_interword_spaces:"0",
     user_defined_dpi:"300",
     tessedit_pageseg_mode:"6"
   });
   for(let i=0;i<crops.length;i++){
     scanStatus.innerHTML=`<b>🔍 カード番号を読み取り中…</b><p class='progress'>左下端を解析中 ${i+1}/${crops.length}</p>`;
     const result=await worker.recognize(crops[i]);
     const text=result?.data?.text||"";
     raw.push(text.trim());
     found.push(...extractIds(text));
   }
   await worker.terminate();worker=null;
   showOCR([...new Set(found)],raw);
 }catch(e){
   if(worker){try{await worker.terminate()}catch(_){} }
   showOCR([],[]);
 }
}
function cleanId(s){
 let x=normalize(s).replace(/[^A-Z0-9-]/g,"");
 const pm=x.match(/^(E1|EP)-?(\d{1,3})-?P$/);
 if(pm)return pm[1]+"-"+pm[2].padStart(2,"0")+"-P";
 const m=x.match(/^(E1|EP)-?(\d{1,3})$/);
 return m?m[1]+"-"+m[2].padStart(2,"0"):x;
}
function nameMatches(q){
 const x=String(q||"").trim().toLowerCase();
 if(!x)return [];
 return ALL_CARDS.filter(c=>c.name.toLowerCase().includes(x)||c.id.toLowerCase().includes(x)).slice(0,12);
}
function pickName(id){
 const c=ALL_CARDS.find(x=>x.id===id);if(!c)return;
 manualId.value=c.id;nameSearch.value=c.name;validateId();
}
function showOCR(found,raw=[]){
 const first=found[0]||"";
 app.innerHTML=`<section class="scanbox">
 <h2>📋 読み取り結果</h2>
 <p>誤認識防止のため、<strong>ここではまだ登録していません。</strong><br>番号またはコーデ名を選んで確認してから確定してください。</p>
 <div class="result">
 <label><b>カード番号</b></label>
 <input id="manualId" value="${escapeHtml(first)}" placeholder="例：EP-037">
 <div id="validation" class="sub" style="margin-top:7px"></div>
 <div style="margin-top:10px"><b>OCR候補</b><br>
 ${found.length?found.map(id=>{const c=ALL_CARDS.find(x=>x.id===id);return `<button class="candidate" onclick="pickName('${id}')">${id}：${escapeHtml(c?.name||"")}</button>`}).join(""):"<span class='sub'>有効な候補なし。下の名前検索も使えます。</span>"}
 </div>
 <details style="margin-top:10px"><summary class="sub">OCRが読んだ文字を見る</summary><pre style="white-space:pre-wrap;font-size:10px;background:#fff8fc;padding:8px;border-radius:8px;max-height:110px;overflow:auto">${escapeHtml(raw.filter(Boolean).join("\n---\n"))||"（文字を認識できませんでした）"}</pre></details>
 <div class="nameSearch">
   <b>🔎 コーデ名・カード名から選ぶ</b>
   <input id="nameSearch" placeholder="例：オーロラキス / スターウェイ" oninput="renderNameCandidates()">
   <div id="nameCandidates" class="nameCandidates"></div>
   <div style="margin-top:10px"><b>✨ パラレルなら</b><br><span class="sub">同じコーデ名の「✨ P」候補を選ぶと、通常カードとは別に登録できます。</span></div>
 </div>
 <button class="scanbtn" style="margin-top:12px" onclick="confirmAdd()">💗 このカードを所持にする</button>
 <button class="scanbtn secondary" style="margin-top:8px" onclick="renderScan()">🔄 撮り直し</button>
 </div></section>`;
 manualId.oninput=validateId;validateId();
}
function renderNameCandidates(){
 const list=nameMatches(nameSearch.value);
 nameCandidates.innerHTML=list.length?list.map(c=>`<button class="nameCandidate" onclick="pickName('${c.id}')"><b>${escapeHtml(c.name)}</b><span class="sub">${c.id} ・ ${c.rarity}</span></button>`).join(""):"<span class='sub'>候補がここに出るよ♡</span>";
}
function validateId(){
 const id=cleanId(manualId.value);manualId.value=id;
 if(!id){validation.textContent="番号を入力してね";validation.className="sub";return false}
 if(!VALID.has(id)){validation.textContent="⚠️ 図鑑に存在しない番号なので登録できません";validation.className="err";return false}
 const n=Number(qty[id]||0),c=ALL_CARDS.find(x=>x.id===id);
 validation.innerHTML=`✅ <b>${escapeHtml(c.name)}</b>（${id}）は登録可能：現在 ${n}枚 → 追加後 ${n+1}枚`;
 validation.className="ok";return true;
}
function confirmAdd(){
 if(!validateId())return;
 const id=cleanId(manualId.value),n=(Number(qty[id])||0)+1,c=ALL_CARDS.find(x=>x.id===id);
 qty[id]=n;save();toast.textContent=`${c.name} を1枚追加！ 現在 ${n}枚`;
 setTimeout(()=>toast.textContent="",1800);renderScan();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 view=b.dataset.view;
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));
 render();
});
updateStats();render();
</script>
</body>
